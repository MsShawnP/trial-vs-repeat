[project]
name = "trial-vs-repeat"
version = "0.1.0"
description = "Leaky Bucket — trial vs repeat analyzer (Cinderhaven sales-penetration tool #4)"
requires-python = ">=3.11"
# Data is in-process: the app imports the seed-locked cinderhaven-household-panel
# package (built by tool #3, vendored here under packages/) and warms it in memory
# at startup — no psycopg2, no DATABASE_URL, no Postgres. See CLAUDE.md.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "cinderhaven-household-panel>=0.1.0",
    "lailara-palette>=2.1.0",     # vendored design tokens (packages/lailara-palette)
    "dash>=3.0",
    "plotly>=6.0",
    "dash-ag-grid>=31.0",
    "gunicorn>=21.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
